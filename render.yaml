services:
  - type: web
    name: invoice-decision-agent
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard
      - key: ADMIN_TOKEN
        generateValue: true  # protects "Reset demo ledger" on the public URL
      - key: DATA_DIR
        value: /data
